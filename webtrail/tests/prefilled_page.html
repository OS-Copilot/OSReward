<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pet Search</title>
<style>
  body { font-family: sans-serif; margin: 60px; font-size: 18px; }
  input { font-size: 20px; padding: 8px; width: 380px; }
  button { font-size: 20px; padding: 8px 18px; margin-left: 8px; }
  #result { margin-top: 30px; font-size: 22px; color: #114488; }
  .hint { color: #666; font-size: 15px; margin-top: 8px; }
</style>
</head>
<body>
  <h2>Pet Search</h2>
  <label for="q">Search query:</label><br><br>
  <input id="q" value="cats" autocomplete="off">
  <button id="btn">Search</button>
  <div class="hint">Press Enter or click Search to submit.</div>
  <div id="result">No search performed yet.</div>

  <script>
    const input = document.getElementById('q');
    const result = document.getElementById('result');
    function submit() {
      result.textContent = 'You searched for: "' + input.value + '"';
    }
    document.getElementById('btn').addEventListener('click', submit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
  </script>
</body>
</html>
