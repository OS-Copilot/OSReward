[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webtrail"
version = "0.1.0"
description = "Web trajectory collection for agent training data: async episode runner, stealth browser service client, block detection, and rule-based curation."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
# task import from Hugging Face datasets / parquet (see `webtrail tasks import`)
data = [
    "datasets>=2.14",
    "pyarrow>=14.0",
]

[project.scripts]
webtrail = "webtrail.__main__:main"

[tool.setuptools.packages.find]
include = ["webtrail*"]
